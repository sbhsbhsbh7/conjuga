<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<meta name="description" content="Révise les conjugaisons du portugais brésilien : présent, passé, imparfait, futur.">

<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
</style>
<title>Conjuga</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&family=Unbounded:wght@600;800&display=swap">
<style>
/* Layout: one narrow app column (max 640px), a calçadão wave band under the header, path of numbered stages, full-screen exercise cards. */
:root{
  --bg:#EEF3F0; --surface:#FFFFFF; --surface-2:#E2EAE5; --ink:#10221B; --muted:#55685E; --line:#C9D7CF;
  --leaf:#08805A; --leaf-ink:#FFFFFF; --leaf-soft:#D2EEE1;
  --sun:#F2B300; --sun-soft:#FFF0C0; --sun-ink:#4A3600;
  --sea:#1D4FB5; --sea-soft:#DCE6FB;
  --bad:#C4362C; --bad-soft:#FBE0DC;
  --wave:#10221B; --wave-bg:#FFFFFF;
  --display:"Unbounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1511; --surface:#13211B; --surface-2:#1A2C24; --ink:#E5EEE9; --muted:#93A89D;
  --line:#2A4036; --leaf:#2DBF86; --leaf-ink:#05140D; --leaf-soft:#11392A;
  --sun:#F5C53A; --sun-soft:#3A2F0E; --sun-ink:#FFE9A8;
  --sea:#86AAFF; --sea-soft:#1A2A4C; --bad:#FF7A6C; --bad-soft:#41211C;
  --wave:#E5EEE9; --wave-bg:#0B1511; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B1511; --surface:#13211B; --surface-2:#1A2C24; --ink:#E5EEE9; --muted:#93A89D;
  --line:#2A4036; --leaf:#2DBF86; --leaf-ink:#05140D; --leaf-soft:#11392A;
  --sun:#F5C53A; --sun-soft:#3A2F0E; --sun-ink:#FFE9A8;
  --sea:#86AAFF; --sea-soft:#1A2A4C; --bad:#FF7A6C; --bad-soft:#41211C;
  --wave:#E5EEE9; --wave-bg:#0B1511; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;
  -webkit-tap-highlight-color:transparent}
#app{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.label{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Wave band (calçadão) */
.wave{display:block;width:100%;height:22px;border-radius:6px}

/* Home */
.top{display:flex;flex-direction:column;gap:14px;padding-top:22px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1 span{color:var(--leaf)}
.hello{font-size:1.05rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:var(--r);padding:12px;display:flex;align-items:center;gap:10px;min-width:0}
.stat b{font-family:var(--display);font-size:1.25rem;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.stat small{color:var(--muted);font-size:.78rem;display:block}
.stat svg{flex:none}
.ring circle{fill:none;stroke-width:5}
.go{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;border:0;border-radius:18px;padding:18px;
  background:var(--leaf);color:var(--leaf-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--leaf) 60%,#000)}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--leaf) 60%,#000)}
.go .t{font-family:var(--display);font-weight:800;font-size:1.1rem;display:block}
.go small{opacity:.9}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.qbtn strong{font-family:var(--display);font-size:.92rem;font-weight:600}
.qbtn small{color:var(--muted);font-size:.82rem}
.qbtn .pill{align-self:flex-start}
.pill{font-family:var(--mono);font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sun-soft);color:var(--sun-ink)}

.path{display:flex;flex-direction:column;gap:0;margin-top:26px}
.path-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.stage{display:grid;grid-template-columns:44px 1fr;gap:14px;position:relative;padding-bottom:18px}
.stage:not(:last-child)::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line)}
.num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--surface);border:2px solid var(--line);color:var(--muted)}
.stage.done .num{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink)}
.stage.next .num{border-color:var(--sun);background:var(--sun-soft);color:var(--sun-ink)}
.sbody{display:flex;flex-direction:column;gap:8px;min-width:0;padding-top:2px}
.sbody h3{font-size:1rem}
.sbody .muted{font-size:.9rem}
.sacts{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem}
.sbtn.ok{border-color:var(--leaf);color:var(--leaf)}
.stars{display:inline-flex;gap:1px}
.links{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.linkbtn{border:0;background:none;color:var(--sea);font-weight:700;text-align:left;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;font-size:.88rem;color:var(--muted)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Bars */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.x{border:0;background:var(--surface);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.prog{flex:1;height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width .3s}
.xpnow{font-family:var(--mono);font-weight:600;color:var(--sun-ink);background:var(--sun-soft);padding:3px 9px;border-radius:99px;font-size:.85rem;font-variant-numeric:tabular-nums}

/* Lesson */
.lesson{display:flex;flex-direction:column;gap:18px;padding-bottom:20px}
.lesson .intro{font-size:1.05rem}
.tip{background:var(--sun-soft);color:var(--sun-ink);border-radius:var(--r);padding:12px 14px;font-size:.95rem}
.tip b:first-child{font-family:var(--mono);text-transform:uppercase;font-size:.72rem;letter-spacing:.08em;display:block;margin-bottom:2px}
.tip.blue{background:var(--sea-soft);color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.vcard{background:var(--surface);border-radius:var(--r);padding:10px 12px;min-width:0}
.vhead{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.vinf{font-family:var(--display);font-weight:600;font-size:.95rem}
.vfr{color:var(--muted);font-size:.8rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.vrows li{display:grid;grid-template-columns:44px 1fr;gap:6px;align-items:baseline;font-size:.95rem}
.pp{font-family:var(--mono);font-size:.7rem;color:var(--muted);white-space:nowrap}
.ff{font-weight:700;overflow-wrap:anywhere}
.ff .e{color:var(--leaf)}
.ff .irr{background:var(--sun-soft);color:var(--sun-ink);padding:0 4px;border-radius:5px}
.ff .hide{background:var(--surface-2);color:var(--muted);padding:0 10px;border-radius:5px}
.ff .hl{outline:2px solid var(--leaf);outline-offset:1px;border-radius:5px;padding:0 3px}
.spk{border:0;background:var(--surface-2);border-radius:99px;width:30px;height:30px;display:grid;place-items:center;flex:none;color:var(--sea)}
.ends{overflow-x:auto}
.ends table{border-collapse:collapse;width:100%;font-size:.92rem;background:var(--surface);border-radius:var(--r);overflow:hidden}
.ends th,.ends td{padding:8px 8px;text-align:left;white-space:nowrap}
.ends th{font-family:var(--mono);font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.ends tr+tr td{border-top:1px solid var(--surface-2)}
.ends td:first-child{font-family:var(--display);font-weight:600}
.ends td{color:var(--leaf);font-weight:700}
.exs{display:flex;flex-direction:column;gap:8px}
.exl{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;background:var(--surface);border-radius:12px;padding:10px 12px}
.exl .pt{font-weight:700}
.exl .fr{color:var(--muted);font-size:.9rem}
.markers{display:flex;flex-direction:column;gap:10px}
.mk{background:var(--surface);border-radius:12px;padding:12px}
.mk strong{font-family:var(--display);font-size:.9rem}
.cta{border:0;border-radius:16px;padding:16px;background:var(--leaf);color:var(--leaf-ink);font-family:var(--display);font-weight:800;font-size:1rem;width:100%;box-shadow:0 4px 0 color-mix(in srgb,var(--leaf) 60%,#000)}
.cta:active{transform:translateY(3px);box-shadow:none}
.cta.alt{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.cta:disabled{opacity:.5}

/* Quiz */
.quiz{display:flex;flex-direction:column;gap:16px;padding-bottom:20px}
.kind{font-family:var(--mono);font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sea)}
.sent{font-size:1.45rem;line-height:1.45;font-weight:700}
.gap{display:inline-block;min-width:3.5em;border-bottom:3px solid var(--sea);color:var(--muted);font-weight:400;font-size:1.05rem;padding:0 4px;text-align:center}
.gap.filled{color:var(--leaf);font-weight:700;font-size:1.45rem;border-color:var(--leaf)}
.trad{color:var(--muted);font-size:.98rem;font-style:italic}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.chip.v{background:var(--sea-soft);border-color:transparent}
.answer{width:100%;font:inherit;font-size:1.25rem;font-weight:700;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.answer:focus{border-color:var(--sea);outline:none}
.answer.bad{border-color:var(--bad);animation:shake .35s}
.answer.good{border-color:var(--leaf);background:var(--leaf-soft)}
.answer.near{border-color:var(--sun)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.accents{display:flex;flex-wrap:wrap;gap:6px}
.accents button{border:1px solid var(--line);background:var(--surface);border-radius:9px;min-width:38px;height:38px;font-size:1.05rem;font-weight:700}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;text-align:left;font-size:1.1rem;font-weight:700;box-shadow:0 3px 0 var(--line)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);box-shadow:none;text-decoration:line-through}
.opt.good{border-color:var(--leaf);background:var(--leaf-soft);box-shadow:none}
.opt.gone{opacity:.3;text-decoration:line-through}
.tgrid{display:flex;flex-direction:column;gap:8px}
.trow{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center}
.trow label{font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.trow .answer{font-size:1.1rem;padding:10px 12px}
.hints{display:flex;flex-direction:column;gap:8px}
.hint{background:var(--sea-soft);border-radius:12px;padding:10px 12px;font-size:.98rem}
.hint b{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--sea);display:block}
.hint .vrows{margin-top:6px}
.dock{position:sticky;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.drow{display:flex;gap:10px}
.drow .cta{flex:1}
.hbtn{border:2px solid var(--sea);color:var(--sea);background:var(--surface);border-radius:16px;padding:0 14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;flex:none}
.hbtn:disabled{opacity:.4}
.give{border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.9rem;align-self:center;padding:2px}
.fb{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.fb.good{background:var(--leaf-soft)}
.fb.bad{background:var(--bad-soft)}
.fb.near{background:var(--sun-soft);color:var(--sun-ink)}
.fb .ttl{font-family:var(--display);font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.fb.good .ttl{color:var(--leaf)}
.fb.bad .ttl{color:var(--bad)}
.fb .why{font-size:.95rem}
.fb .vrows{background:var(--surface);border-radius:10px;padding:8px 10px}

/* Result */
.result{display:flex;flex-direction:column;gap:18px;align-items:stretch;padding-top:30px;text-align:center}
.bigstars{display:flex;justify-content:center;gap:10px}
.bigstars svg{width:58px;height:58px}
.bigstars .on{animation:pop .5s both}
.bigstars .on:nth-child(2){animation-delay:.2s}.bigstars .on:nth-child(3){animation-delay:.4s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.rstats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rstats div{background:var(--surface);border-radius:var(--r);padding:12px}
.rstats b{font-family:var(--display);font-size:1.4rem;display:block;font-variant-numeric:tabular-nums}
.missed{text-align:left;display:flex;flex-direction:column;gap:6px}
.missed li{background:var(--surface);border-radius:10px;padding:8px 12px;list-style:none}
.missed ul{padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.8}}

/* Reference */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:700;font-size:.88rem;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.qbtn.wide{grid-column:1/-1;border-color:var(--sea);background:var(--sea-soft)}
.csecs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.csecs .qbtn:first-child{grid-column:1/-1}
.words{margin:0;display:flex;flex-direction:column;background:var(--surface);border-radius:12px;overflow:hidden}
.words>div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:9px 12px}
.words>div+div{border-top:1px solid var(--surface-2)}
.words dt{font-weight:700;color:var(--leaf)}
.words dd{margin:0;color:var(--muted);font-size:.92rem}
.tline{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:14px}
.tline li{position:relative;display:flex;flex-direction:column;gap:2px}
.tline li::before{content:"";position:absolute;left:-25px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--leaf);border:2px solid var(--bg)}
.tline strong{font-family:var(--display);font-size:.95rem;font-weight:600}
.tline p{margin:0;font-size:.88rem}
@media (max-width:420px){.words>div{grid-template-columns:1fr;gap:2px}.csecs{grid-template-columns:1fr}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.stats{gap:6px}.stat{padding:10px 8px;gap:6px}.stat b{font-size:1.05rem}.sent{font-size:1.25rem}.trow{grid-template-columns:90px 1fr}}
</style>
</head>

<script>
"use strict";
/* ========== Données verbales ========== */
const PL = ["eu","você","nós","vocês"];
const PLL = ["eu","você / ele","nós","vocês / eles"];

const TNAME = {pres:"presente", perf:"pretérito perfeito", imp:"imperfeito", fut:"futuro simples", prox:"futur proche (ir + infinitif)"};

const END = {

  perf:{ar:["ei","ou","amos","aram"],er:["i","eu","emos","eram"],ir:["i","iu","imos","iram"]},

  fut:{ar:["ei","á","emos","ão"],er:["ei","á","emos","ão"],ir:["ei","á","emos","ão"]}
};
const V = {
  falar:{fr:"parler"}, morar:{fr:"habiter"}, trabalhar:{fr:"travailler"}, estudar:{fr:"étudier"},
  gostar:{fr:"aimer"}, tomar:{fr:"prendre, boire"}, jantar:{fr:"dîner"}, viajar:{fr:"voyager"},
  acordar:{fr:"se réveiller"}, encontrar:{fr:"rencontrer"},
  chegar:{fr:"arriver", f:{perf:["cheguei","chegou","chegamos","chegaram"]}},
  ficar:{fr:"rester", f:{perf:["fiquei","ficou","ficamos","ficaram"]}},
  brincar:{fr:"jouer", f:{perf:["brinquei","brincou","brincamos","brincaram"]}},
  começar:{fr:"commencer", f:{perf:["comecei","começou","começamos","começaram"]}},
  comer:{fr:"manger"}, beber:{fr:"boire"}, aprender:{fr:"apprendre"}, viver:{fr:"vivre"}, escrever:{fr:"écrire"},
  abrir:{fr:"ouvrir"}, partir:{fr:"partir"}, assistir:{fr:"regarder (TV)"}, decidir:{fr:"décider"},
  ser:{fr:"être (durable)", irr:1, f:{pres:["sou","é","somos","são"],perf:["fui","foi","fomos","foram"],imp:["era","era","éramos","eram"]},

function grp(inf){ const g = inf.slice(-2); return g==="ôr"?"er":g; }
function regular(inf,t){
  if(t==="fut") return END.fut.ar.map(e=>inf.replace("ô","o")+e);
  const st = inf.slice(0,-2); return END[t][grp(inf)].map(e=>st+e);
}
function conj(inf,t){
  if(t==="prox") return V.ir.f.pres.map(x=>x+" "+inf);
  const v=V[inf]; return (v && v.f && v.f[t]) ? v.f[t] : regular(inf,t);
}
function isIrrForm(inf,t,i){ return t!=="prox" && conj(inf,t)[i]!==regular(inf,t)[i]; }

let S=(()=>{try{const r=JSON.parse(localStorage.getItem(KEY)||"null");if(r)return Object.assign(blank(),r);}catch(e){}return blank();})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const ds=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const yday=()=>{const d=new Date();d.setDate(d.getDate()-1);return ds(d);};
function todayXP(){return S.today.d===ds()?S.today.xp:0;}
function streak(){return (S.lastDay===ds()||S.lastDay===yday())?S.streak:0;}
function addXP(n){
  const t=ds(); if(S.today.d!==t) S.today={d:t,xp:0};
  S.today.xp+=n; S.xp+=n;
  if(S.lastDay!==t){S.streak=(S.lastDay===yday())?S.streak+1:1;S.lastDay=t;}
  save();
}

const $=s=>document.querySelector(s);
const app=()=>$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const norm=s=>String(s).toLowerCase().replace(/[’`]/g,"'").replace(/\s+/g," ").trim().replace(/[.!?]+$/,"").trim();
const bare=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"");
function dropPron(s){
  const all=PRON.flat().sort((a,b)=>b.length-a.length);
  for(const p of all){ if(s.startsWith(p+" ")) return s.slice(p.length+1); }
  return s;
}
function judge(input,answers){
  let x=norm(input); if(!x) return "empty";
  const cands=[x,dropPron(x)];
  const A=answers.map(norm);
  if(cands.some(c=>A.includes(c))) return "ok";
  if(cands.some(c=>A.map(bare).includes(bare(c)))) return "accent";
  return "bad";
}

/* ========== Sessions d'exercices ========== */
function itemFromKey(k){
  if(k.startsWith("g|")){const [,v,t,p]=k.split("|");return genItem(v,t,+p);}
  const [u,i]=k.split("-").map(Number); const it=UNITS[u]&&UNITS[u].items[i];
  return it?Object.assign({hideTense:UNITS[u].hideTense},it):null;
}
function genItem(v,t,p){return {k:"fill",gen:true,v,t,p,pron:rnd(PRON[p]),fr:`${V[v].fr} · ${TFR[t]}`};}
function newSession(mode,list,extra={}){
  SES=Object.assign({mode,list,idx:0,xp:0,max:0,missed:[],done:false,correct:0},extra);
  SES.list.forEach(e=>SES.max+=maxXP(e.item));
  resetItemState();
}
function maxXP(it){return it.k==="tab"?15:it.k==="qcm"?8:10;}
function startUnit(u,noNav){
  const U_=UNITS[u]; const list=U_.items.map((it,i)=>({key:u+"-"+i,item:Object.assign({hideTense:U_.hideTense},it)}));
  newSession("unit",list,{u}); if(!noNav) go("exos-"+(u+1));
}
function tensesOpen(){
  const done=id=>!!(S.units[id]||{}).stars;
  const T=[]; T.push("pres");
  if(done("u4")||done("u5")) T.push("perf");
  if(done("u6")) T.push("imp");
  if(done("u7")) T.push("fut");
  return T;
}
function irrOpen(t){const m={pres:["u2","u3"],perf:["u5"],imp:["u6"],fut:["u7"]};return (m[t]||[]).some(id=>(S.units[id]||{}).stars);}
function randGen(){
  const t=rnd(tensesOpen());
  let pool=REGULAR_POOL.slice();
  if(irrOpen(t)){
    let irr=IRR_POOL;
    if(t==="imp") irr=["ser","ter","vir","pôr","fazer","estar","ir"];
    if(t==="fut") irr=["fazer","dizer","trazer","ser","ter","ir"];
    pool=pool.concat(irr,irr); // les irréguliers reviennent plus souvent
  }
  const v=rnd(pool), p=Math.floor(Math.random()*4);
  return {key:`g|${v}|${t}|${p}`,item:genItem(v,t,p)};
}
function startExpress(noNav){
  const list=[];const seen=new Set();
  while(list.length<10){const g=randGen(); if(!seen.has(g.key)){seen.add(g.key);list.push(g);} }
  newSession("express",list); if(!noNav) go("express");
}
function startReview(noNav){
  const keys=shuffle(S.review).slice(0,7);
  const list=keys.map(k=>({key:k,item:itemFromKey(k)})).filter(e=>e.item);
  const doneUnits=UNITS.map((u,i)=>[u,i]).filter(([u])=>(S.units[u.id]||{}).stars);
  while(list.length<10){
    if(doneUnits.length && Math.random()<.6){
      const [u,ui]=rnd(doneUnits); const ii=Math.floor(Math.random()*u.items.length); const k=ui+"-"+ii;
      if(u.items[ii].k!=="tab" && !list.some(e=>e.key===k)) list.push({key:k,item:Object.assign({hideTense:u.hideTense},u.items[ii])});
    } else { const g=randGen(); if(!list.some(e=>e.key===g.key)) list.push(g); }
  }
  newSession("review",shuffle(list)); if(!noNav) go("revision");
}

/* État de l'item courant */
let IS=null;
function resetItemState(){IS={hints:0,wrong:0,status:"open",removed:[],cells:null,last:"",fb:null};}
function cur(){return SES.list[SES.idx];}
function answersOf(it){
  if(it.k!=="fill") return [];
  const a=[conj(it.v,it.t)[it.p]];
  return a.concat(it.alt||[]);
}

/* Construction des indices */
function shape(ans){
  return ans.split(" ").map(w=>{const n=w.length;const k=n<=2?0:Math.max(1,Math.ceil(n*.4));return w.slice(0,k)+" _".repeat(n-k).replace(/^ /,k?" ":"");}).join("   ")
}
function ruleHint(v,t,p){
  if(t==="prox") return `Futur proche : ir au présent, puis l'infinitif ${v}.`;
  const vv=V[v];
  if(vv.n&&vv.n[t]) return `Verbe irrégulier. ${vv.n[t]}`;
  if(vv.f&&vv.f[t]&&!vv.irr&&isIrrForm(v,t,p)) return `Petit changement d'orthographe avec eu au passé, pour garder le son.`;
  if(vv.irr && isIrrForm(v,t,p)) return `Verbe irrégulier ici : la forme ne suit pas le modèle régulier.`;
  if(vv.irr) return `Bonne nouvelle : à cette personne, ${v} se conjugue comme un verbe régulier en -${grp(v)}.`;
  if(t==="fut") return `Verbe régulier : on garde l'infinitif entier (${v}) et on ajoute la terminaison du futur.`;
  return `Verbe régulier en -${grp(v)} : radical ${v.slice(0,-2)}- + terminaison ${t==="pres"?"du présent":t==="perf"?"du perfeito":"de l'imparfait"}.`;
}
function endHint(v,t){
  if(t==="prox"||V[v].irr) return null;
  const e=END[t][grp(v)];
  return `Terminaisons ${t==="fut"?"du futur":"en -"+grp(v)} : ${e.map(x=>"-"+x).join(", ")} (eu, você, nós, vocês).`;
}
function hintsFor(it){
  const H=[];
  if(it.k==="fill"){
    if(it.h) H.push({t:"Indice",html:esc(it.h)});
    H.push({t:"Règle",html:esc(ruleHint(it.v,it.t,it.p))});
    const eh=endHint(it.v,it.t);
    if(eh) H.push({t:"Terminaisons",html:esc(eh)});
    else H.push({t:"Le tableau sans la réponse",html:rowsHTML(it.t==="prox"?it.v:it.v,it.t,{mask:it.p})});
    H.push({t:"Forme du mot",html:`<span class="mono" style="font-size:1.15rem;letter-spacing:.06em">${esc(shape(answersOf(it)[0]))}</span>`});
  } else if(it.k==="qcm"){
    if(it.h) H.push({t:"Indice",html:esc(it.h)});
    H.push({t:"50/50",html:"Deux mauvaises réponses ont été retirées.",act:"remove"});
  } else {
    H.push({t:"Règle",html:esc(V[it.v].n&&V[it.v].n[it.t]?V[it.v].n[it.t]:(endHint(it.v,it.t)||ruleHint(it.v,it.t,0)))});
    H.push({t:"Début des formes",html:"Les premières lettres sont écrites dans les cases encore fausses.",act:"prefix"});
  }
  return H;
}

/* ========== Écran d'exercice ========== */
function sentenceHTML(it,filled){
  if(it.gen){

  }

  const gap = `<span class="gap ${filled?"filled":""}">${filled?esc(filled):"("+esc(chip)+")"}</span>`;
  return esc(it.s).replace("___",gap);
}

function accentBar(){return `<div class="accents" aria-label="Lettres accentuées">${"á à â ã ç é ê í ó ô õ ú".split(" ").map(c=>`<button type="button" data-ins="${c}" tabindex="-1">${c}</button>`).join("")}</div>`;}

/* Vérification */
function feedbackBody(it){
  let why="";
  if(it.why) why=`<p class="why">${esc(it.why)}</p>`;
  if(it.k==="fill"){
    const forms=conj(it.v,it.t);
    const say=forms.map((x,i)=>PRON[i][0]+" "+x).join(", ");
    const full=it.gen?`${it.pron} ${forms[it.p]}`:it.s.replace("___",IS.shown||forms[it.p]);
    why+=`<div style="display:flex;align-items:center;gap:8px"><span class="why"><b>${esc(it.v)}</b> · ${esc(TNAME[it.t])}</span>${spk(full,"Écouter la phrase")}</div>${rowsHTML(it.v,it.t,{hl:it.p})}`;
  }
  if(it.k==="tab"){ const forms=conj(it.v,it.t); why+=rowsHTML(it.v,it.t)+ (canSpeak?`<div>${spk(forms.map((x,i)=>PRON[i][0]+" "+x).join(", "),"Écouter")}</div>`:""); }
  return why;
}
const PRAISE=["Muito bem !","Isso aí !","Perfeito !","Mandou bem !","Show !","Arrasou !"];
function finishItem(success){
  const it=cur().item;
  let gain=0;
  if(success){ gain=Math.max(2,maxXP(it)-3*IS.hints-2*IS.wrong); SES.correct++; }
  SES.xp+=gain; if(gain) addXP(gain);
  const k=cur().key;
  const struggled=!success||IS.hints>=2||IS.wrong>=2;
  if(struggled){ if(!S.review.includes(k)) S.review.push(k); SES.missed.push(cur()); }
  else if(S.review.includes(k) && IS.hints===0 && IS.wrong===0){ S.review=S.review.filter(x=>x!==k); }
  if(S.review.length>60) S.review=S.review.slice(-60);
  save();
  IS.status="done";
  IS.fb={cls:success?"good":"bad", title: success ? `${rnd(PRAISE)} +${gain} XP` : "La bonne réponse", body:feedbackBody(it)};
  renderQuiz();
}
function check(){
  const it=cur().item; if(IS.status==="done") return;
  if(it.k==="fill"){
    const v=$("#ans").value; IS.last=v;
    const r=judge(v,answersOf(it));
    if(r==="empty"){ IS.fb={cls:"near",title:"Écris une réponse, ou demande un indice."}; IS.cls=""; return renderQuiz(); }
    if(r==="ok"){ IS.cls="good"; const A=answersOf(it).map(norm), x=norm(v), y=dropPron(x); IS.shown=A.includes(y)?y:A.includes(x)?x:answersOf(it)[0]; return finishItem(true); }
    IS.wrong++;
    if(r==="accent"){ IS.cls="near"; IS.fb={cls:"near",title:"Presque ! Vérifie les accents.",body:"Les lettres sont bonnes, mais un accent manque, est en trop ou n'est pas le bon."}; }
    else { IS.cls="bad"; IS.fb={cls:"bad",title:"Pas encore.",body: IS.hints<hintsFor(it).length ? "Relis la phrase : qui fait l'action ? Tu peux prendre un indice." : "Compare avec la forme du mot dans l'indice."}; }
    return renderQuiz();
  }
  if(it.k==="tab"){
    const forms=conj(it.v,it.t); IS.cellCls=[];
    let all=true, anyEmpty=false;
    [0,1,2,3].forEach(i=>{const val=$("#c"+i).value; IS.cells[i]=val; const r=judge(val,[forms[i]]);
      IS.cellCls[i]= r==="ok"?"good": r==="accent"?"near": r==="empty"?"":"bad"; if(r!=="ok") all=false; if(r==="empty") anyEmpty=true;});
    if(all) return finishItem(true);
    if(!anyEmpty || IS.cellCls.some(c=>c==="bad"||c==="near")) IS.wrong++;
    const nNear=IS.cellCls.filter(c=>c==="near").length;
    IS.fb={cls:nNear&&!IS.cellCls.includes("bad")?"near":"bad",title: anyEmpty&&!IS.cellCls.includes("bad")&&!nNear?"Remplis les 4 cases.":"Les cases en couleur sont à corriger.", body: nNear?"Les cases en jaune : seul un accent pose problème.":""};
    return renderQuiz();
  }
}
function pick(i){
  const it=cur().item; if(IS.status==="done") return;
  if(i===it.a) return finishItem(true);
  IS.wrong++; IS.picked=(IS.picked||[]).concat(i);
  IS.fb={cls:"bad",title:"Non, essaie encore.",body:it.h&&IS.hints===0?"Un indice peut t'aider.":""};
  renderQuiz();
}
function hint(){
  const it=cur().item; const H=hintsFor(it); if(IS.hints>=H.length) return;
  if(it.k==="fill"&&$("#ans")) IS.last=$("#ans").value;
  if(it.k==="tab") [0,1,2,3].forEach(i=>IS.cells[i]=$("#c"+i).value);
  const h=H[IS.hints]; IS.hints++; IS.fb=null;
  if(h.act==="remove"){ const wrongs=shuffle(it.o.map((_,i)=>i).filter(i=>i!==it.a&&!(IS.picked||[]).includes(i))); const rem=it.o.length>=4?2:1; IS.removed=wrongs.slice(0,Math.max(0,Math.min(rem,wrongs.length-1))); }
  if(h.act==="prefix"){ const forms=conj(it.v,it.t); [0,1,2,3].forEach(i=>{ if(!IS.cellCls||IS.cellCls[i]!=="good"){ const f=forms[i]; const k=Math.max(1,Math.ceil(f.length*.5)); if(!norm(IS.cells[i]).startsWith(f.slice(0,k))) IS.cells[i]=f.slice(0,k);} }); }
  renderQuiz();
}
function reveal(){
  const it=cur().item;
  if(it.k==="fill"){ IS.last=answersOf(it)[0]; IS.shown=answersOf(it)[0]; IS.cls=""; }
  if(it.k==="tab"){ IS.cells=conj(it.v,it.t).slice(); IS.cellCls=["","","",""]; }
  finishItem(false);
}
function next(){
  SES.idx++; resetItemState();
  if(SES.idx>=SES.list.length){ SES.done=true; endSession(); return go("bilan"); }

}

function endSession(){

}

const hasCarnet = typeof CARNET!=="undefined";
let carnetFilter="";
function sayLine(pt){return spk(pt.replace(/\s—\s.*/,"").replace(/[\/…]/g," "))||"<span></span>";}
function carnetBlock(b){
  if(b.h) return `<h2>${esc(b.h)}</h2>`;

function carnetHits(q){
  const n=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  const k=n(q.trim()); if(k.length<2) return null;
  const hits=[];
  CARNET.forEach(s=>{let h="";s.blocks.forEach(b=>{if(b.h)h=b.h;(b.ex||b.words||[]).forEach(([pt,fr])=>{if(n(pt+" "+fr).includes(k))hits.push({s,h,pt,fr});});});});
  return hits;
}
function carnetResults(){
  const hits=carnetHits(carnetFilter); if(!hits) return "";
  if(!hits.length) return `<p class="muted">Rien trouvé pour « ${esc(carnetFilter)} ».</p>`;
  return `<div class="exs">${hits.slice(0,60).map(x=>`<div class="exl">${sayLine(x.pt)}<div><div class="pt">${esc(x.pt)}</div><div class="fr">${esc(x.fr)}</div><div class="label" style="margin-top:4px">${esc(x.s.title)} · ${esc(x.h)}</div></div></div>`).join("")}</div>`;
}

    <div class="csecs">${CARNET.map(s=>`<button class="qbtn" data-go="carnet-${s.id}"><strong>${esc(s.title)}</strong><small>${esc(s.sub)}</small></button>`).join("")}</div>
    <h2>Le parcours</h2>
    <ol class="tline">${CARNET_PARCOURS.map(p=>`<li><span class="label">${esc(p.u)} · ${esc(p.a)} · ${esc(p.d)}</span><strong>${esc(p.t)}</strong>${p.s?`<p class="muted">${esc(p.s)}</p>`:""}</li>`).join("")}</ol>
  </div>`;
}
function renderCarnetSection(id){
  const i=CARNET.findIndex(s=>s.id===id); if(i<0) return go("carnet");
  const s=CARNET[i], nx=CARNET[i+1];
  app().innerHTML=`
  <div class="bar"><button class="x" data-go="carnet" aria-label="Retour au carnet">${IC.x}</button><span class="label" style="flex:1">Carnet · ${esc(s.title)}</span></div>
  <article class="lesson">
    <div><span class="label">${esc(s.sub)}</span><h1 style="font-size:1.6rem;margin-top:4px">${esc(s.title)}</h1></div>
    ${canSpeak?`<p class="muted" style="font-size:.9rem">Touche ${IC.spk.replace('width="16" height="16"','width="13" height="13"')} pour entendre la prononciation brésilienne.</p>`:""}
    ${s.blocks.map(carnetBlock).join("")}
    ${nx?`<button class="cta" data-go="carnet-${nx.id}">Suite : ${esc(nx.title)}</button>`:""}
    <button class="linkbtn" style="text-align:center" data-go="carnet">Retour au sommaire du carnet</button>
  </article>`;
}

/* ========== Événements ========== */
document.addEventListener("click",e=>{
  const s=e.target.closest("[data-say]"); if(s){ speak(s.dataset.say); return; }
  const ins=e.target.closest("[data-ins]");
  if(ins){ const el=document.activeElement&&document.activeElement.classList.contains("answer")?document.activeElement:($("#ans")||lastCell||$("#c0")); if(el&&!el.readOnly){ const a=el.selectionStart??el.value.length, b=el.selectionEnd??el.value.length; el.value=el.value.slice(0,a)+ins.dataset.ins+el.value.slice(b); el.focus(); el.setSelectionRange(a+1,a+1); } return; }
  const g=e.target.closest("[data-go]"); if(g){ go(g.dataset.go); return; }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act;
  if(act==="lesson-done"){ const i=+b.dataset.i; U(UNITS[i].id).read=true; save(); startUnit(i); }
  else if(act==="check") check();
  else if(act==="hint") hint();
  else if(act==="reveal") reveal();
  else if(act==="pick") pick(+b.dataset.i);
  else if(act==="next") next();
  else if(act==="quit") { SES=null; go("accueil"); }
  else if(act==="again"){ if(SES.mode==="unit") startUnit(SES.u); else if(SES.mode==="review") startReview(); else startExpress(); renderQuiz(); }
  else if(act==="reft"){ refTense=b.dataset.t; renderRef(); }
  else if(act==="reset"){ confirmReset=true; renderHome(); }
  else if(act==="reset-no"){ confirmReset=false; renderHome(); }
  else if(act==="reset-yes"){ S=blank(); save(); confirmReset=false; renderHome(); }
});
let lastCell=null;
document.addEventListener("focusin",e=>{ if(e.target.dataset&&e.target.dataset.cell!==undefined) lastCell=e.target; });
document.addEventListener("pointerdown",e=>{ if(e.target.closest("[data-ins]")) e.preventDefault(); });
document.addEventListener("input",e=>{
  if(e.target.id==="carq"){ carnetFilter=e.target.value; $("#carres").innerHTML=carnetResults(); }
  if(e.target.id==="refq"){ refFilter=e.target.value; const pos=e.target.selectionStart; renderRef(); const q_=$("#refq"); q_.focus(); q_.setSelectionRange(pos,pos); }
  if(e.target.id==="ans"&&IS) IS.last=e.target.value;
  if(e.target.dataset&&e.target.dataset.cell!==undefined&&IS&&IS.cells) IS.cells[+e.target.dataset.cell]=e.target.value;
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||!SES||SES.done||!IS) return;
  if(IS.status==="done"){ e.preventDefault(); next(); return; }
  if(!e.target.classList||!e.target.classList.contains("answer")) return;
  e.preventDefault();
  const it=cur().item;
  if(it.k==="tab"){ const c=+e.target.dataset.cell; if(c<3){ const n_=$("#c"+(c+1)); if(n_&&!n_.value){ n_.focus(); return; } } }
  check();
});

route();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });
}
